name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and test with Pipeline
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: c
      pipeline-task: check
      pipeline-ref: main

  docs:
    name: Documentation and workflow validation
    uses: m-mdy-m/pipeline/.github/workflows/docs-check.yml@main

  platform-smoke:
    name: ${{ matrix.os }} native build, Kernel + Lua resolver integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-24.04'
        name: Install native build tools and Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config curl liblua5.4-dev
      - if: matrix.os == 'macos-15'
        name: Install native build tools and Lua 5.4
        run: |
          brew install cmake pkg-config lua@5.4
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix lua@5.4)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - if: matrix.os == 'windows-latest'
        name: Set up MSYS2 UCRT64 with Lua 5.4
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-unzip mingw-w64-ucrt-x86_64-lua54
      - if: matrix.os != 'windows-latest'
        name: Install pinned Kernel package
        shell: bash
        run: bash scripts/install-deps.sh
      - if: matrix.os == 'windows-latest'
        name: Install pinned Kernel package
        shell: msys2 {0}
        run: bash scripts/install-deps.sh
      - if: matrix.os != 'windows-latest'
        name: Strict build and tests
        shell: bash
        run: make check
      - if: matrix.os == 'windows-latest'
        name: Strict build and tests
        shell: msys2 {0}
        run: make check
      - if: matrix.os != 'windows-latest'
        name: Run Lua 5.4 extension resolver integration
        shell: bash
        run: make WITH_LUA=1 integration
      - if: matrix.os == 'windows-latest'
        name: Run Lua 5.4 extension resolver integration
        shell: msys2 {0}
        run: |
          pkg-config --modversion lua5.4
          make WITH_LUA=1 integration

name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Build and test with Pipeline
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: c
      pipeline-task: check
      pipeline-ref: main

  docs:
    name: Documentation lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Markdown linter
        run: npm install --global markdownlint-cli2
      - name: Lint Markdown
        run: bash scripts/lint-docs.sh

  platform-smoke:
    name: ${{ matrix.os }} native build, Kernel + Lua resolver integration
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - if: matrix.os == 'ubuntu-24.04'
        name: Install native build tools and Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config curl liblua5.4-dev
      - if: matrix.os == 'macos-15'
        name: Install native build tools and Lua 5.4
        run: |
          brew install cmake pkg-config lua@5.4
          echo "$(brew --prefix lua@5.4)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix lua@5.4)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
      - if: matrix.os == 'windows-latest'
        name: Set up MSYS2 UCRT64 with Lua 5.4
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-curl mingw-w64-ucrt-x86_64-unzip mingw-w64-ucrt-x86_64-lua54 tar python
      - if: matrix.os != 'windows-latest'
        name: Run Backend service E2E scenarios
        shell: bash
        run: make e2e
      - if: matrix.os == 'windows-latest'
        name: Run Backend service E2E scenarios
        shell: msys2 {0}
        run: make e2e
      - if: matrix.os != 'windows-latest'
        name: Install pinned Kernel package
        shell: bash
        run: bash scripts/install-deps.sh
      - if: matrix.os == 'windows-latest'
        name: Install pinned Kernel package
        shell: msys2 {0}
        run: bash scripts/install-deps.sh
      - if: matrix.os != 'windows-latest'
        name: Build Backend with Lua 5.4 and strict warnings
        shell: bash
        run: make clean && make WITH_LUA=1 all
      - if: matrix.os == 'windows-latest'
        name: Build Backend with Lua 5.4 and strict warnings
        shell: msys2 {0}
        run: |
          pkg-config --modversion lua5.4
          make clean
          make WITH_LUA=1 all
      - if: matrix.os != 'windows-latest'
        name: Run Backend, Kernel and extension resolver integration
        shell: bash
        run: make WITH_LUA=1 integration
      - if: matrix.os != 'windows-latest'
        name: Verify relocatable install and external CMake consumer
        shell: bash
        run: bash scripts/test-installed-package.sh
      - if: matrix.os != 'windows-latest'
        name: Build and verify target-native artifact package
        shell: bash
        run: |
          target_os=linux
          target_abi=gnu-glibc-2.39
          if [[ "${RUNNER_OS}" == macOS ]]; then
            target_os=darwin
            target_abi=macos-15
          fi
          target_arch="$(uname -m)"
          case "$target_arch" in
            x86_64|amd64) target_arch=x86_64 ;;
            aarch64|arm64) target_arch=arm64 ;;
            *) echo "Unsupported runner architecture: $target_arch" >&2; exit 2 ;;
          esac
          BACKEND_TARGET_OS="$target_os" \
          BACKEND_TARGET_ARCH="$target_arch" \
          BACKEND_TARGET_ABI="$target_abi" \
          BACKEND_TARGET_RUNNER="github-actions-$target_os-$target_arch" \
          PIPELINE_RELEASE_TAG=v1.2.1 \
            bash scripts/package-binary.sh
          # Match the native Windows runner.temp path supplied by the shared
          # release workflow's download-artifact step.
          artifact_test_dir="${RUNNER_TEMP}/release-artifact-test"
          artifact_test_dir_posix="$(cygpath -u "$artifact_test_dir")"
          mkdir -p "$artifact_test_dir_posix"
          archive="$(find dist -maxdepth 1 -type f -name 'cdin-backend-*.tar.gz' ! -name '*-source.tar.gz' -print | sort | head -n 1)"
          test -n "$archive"
          cp "$archive" "${archive}.sha256" "$artifact_test_dir_posix/"
          PIPELINE_ARTIFACT_TEST_DIR="$artifact_test_dir" bash scripts/test-binary-package.sh
      - if: matrix.os == 'windows-latest'
        name: Run Backend, Kernel and extension resolver integration
        shell: msys2 {0}
        run: make WITH_LUA=1 integration
      - if: matrix.os == 'windows-latest'
        name: Verify relocatable install and external CMake consumer
        shell: msys2 {0}
        run: bash scripts/test-installed-package.sh
      - if: matrix.os == 'windows-latest'
        name: Build and verify target-native artifact package
        shell: msys2 {0}
        run: |
          BACKEND_TARGET_OS=windows \
          BACKEND_TARGET_ARCH=x86_64 \
          BACKEND_TARGET_ABI=windows-ucrt64 \
          BACKEND_TARGET_RUNNER=github-actions-windows-ucrt64 \
          PIPELINE_RELEASE_TAG=v1.2.1 \
            bash scripts/package-binary.sh
          bash scripts/test-binary-package.sh

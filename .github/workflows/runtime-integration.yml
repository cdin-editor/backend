name: Live Runtime integration

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-integration:
    name: Backend + Lua 5.4 + production Runtime
    runs-on: ubuntu-24.04
    env:
      # Keep the package prefix consistent between the installer and every
      # subsequent Make/pkg-config invocation in this job.
      KERNEL_PREFIX: ${{ github.workspace }}/.deps/kernel
      LOGGER_PREFIX: ${{ github.workspace }}/.deps/logger
    steps:
      - uses: actions/checkout@v7
      - name: Check out the pinned Runtime source
        uses: actions/checkout@v7
        with:
          repository: cdin-editor/runtime
          ref: main
          path: runtime
          persist-credentials: false
      - name: Install Lua 5.4 and native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential pkg-config lua5.4 liblua5.4-dev
      - name: Verify patched Runtime tests and boundaries
        working-directory: runtime
        run: make test boundary
      - name: Install the pinned Kernel package
        run: |
          bash scripts/install-deps.sh --prefix "$KERNEL_PREFIX"
          echo "PKG_CONFIG_PATH=$LOGGER_PREFIX/lib/pkgconfig:$KERNEL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Verify Kernel pkg-config visibility
        run: |
          test -f "$KERNEL_PREFIX/lib/pkgconfig/cdin-kernel.pc"
          printf 'KERNEL_PREFIX=%s\\n' "$KERNEL_PREFIX"
          printf 'PKG_CONFIG_PATH=%s\\n' "$PKG_CONFIG_PATH"
          test "$(pkg-config --modversion cdin-kernel)" = "1.2.1"
          pkg-config --atleast-version=1.2.1 cdin-kernel
          test "$(pkg-config --modversion m-mdy-m-log)" = "0.1.0"
          pkg-config --static --libs cdin-kernel
      - name: Build Backend with Lua enabled
        run: make clean && make WITH_LUA=1 all
      - name: Run Backend / Kernel integration scenarios
        run: make WITH_LUA=1 integration
      - name: Run the real Runtime startup and shutdown smoke test
        env:
          CDIN_RUNTIME_ROOT: ${{ github.workspace }}/runtime/lua
        run: bash scripts/run-runtime-integration.sh
      - name: Check dependency boundaries
        run: bash scripts/check-boundaries.sh
